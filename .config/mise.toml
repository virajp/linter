[settings]
activate_aggressive                = true
all_compile                        = false
gpg_verify                         = true
lockfile                           = true
paranoid                           = true
raw                                = true
status.missing_tools               = "always"
task.disable_spec_from_run_scripts = true
task.timings                       = true

# NodeJS settings
node.compile        = false
node.gpg_verify     = false
node.mirror_url     = "https://nodejs.org/dist/"
npm.package_manager = "pnpm"

[tools]
# Runtime and build tools
dprint     = { version = "latest" }
node       = { postinstall = "npm uninstall --global npm", version = "latest" }
pnpm       = { version = "latest" }
pre-commit = { version = "latest" }
taplo      = { version = "latest" }

# AI Tools

[tasks.init]
description = "Initialize mise tasks"
hide        = true
run         = "find .config/mise/tasks/ -name '*' -type f -exec chmod 755 {} \\;"

[shell_alias]
setup = "mise run setup:all"

[env]
DISABLE_TELEMETRY = 1
_.path            = { path = "node_modules/.bin", tools = true }
