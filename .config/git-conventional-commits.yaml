---
convention:
  commitTypes:
    - feat
    - fix
    - refactor
    - wip
    - spec
    - test
    - ops
    - docs
    - merge
  commitScopes: []

  # GitHub
  commitUrl: https://github.com/virajp/linter-cli/commit/%commit%
  commitRangeUrl: https://github.com/virajp/linter-cli/compare/%from%...%to%?diff=split

  # GitHub Issues
  issueRegexPattern: "#[0-9]+"
  issueUrl: https://github.com/virajp/linter-cli/issues/%issue%
