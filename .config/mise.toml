[settings]
activate_aggressive                = true
all_compile                        = false
gpg_verify                         = true
lockfile                           = true
npm.package_manager                = "bun"
paranoid                           = true
raw                                = true
status.missing_tools               = "always"
task.disable_spec_from_run_scripts = true
task.timings                       = true

[tools]
# Runtime and build tools
bun        = { version = "latest" }
deno       = { version = "latest" }
dprint     = { version = "latest" }
node       = { version = "latest" }
pre-commit = { version = "latest" }
taplo      = { version = "latest" }

# AI Tools
"pipx:kimi-cli" = { depends = [ "uv" ], uvx = "true", version = "latest" }

[tasks.init]
description = "Initialize mise tasks"
hide        = true
run         = "find .config/mise/tasks/ -name '*' -type f -exec chmod 755 {} \\;"

[shell_alias]
setup = "mise run setup:all"

[env]
DISABLE_TELEMETRY = 1
_.path            = { path = "node_modules/.bin", tools = true }
