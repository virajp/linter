name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# OIDC trusted publishing: no NPM_TOKEN, automatic provenance.
permissions:
  contents: read
  id-token: write

env:
  MISE_ENV: ci

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Verify tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "${{ github.ref_name }}" != "$PKG_VERSION" ]; then
            echo "Tag ${{ github.ref_name }} does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and test
        run: pnpm run test:all

      # npm 11.18.0 crashes with "Exit handler never called!" packing a
      # bundledDependencies package; 11.17.0 is the last known-good. Needs
      # >= 11.5.1 for OIDC trusted publishing.
      - name: Pin npm for OIDC publishing
        run: npm install -g npm@11.17.0

      # npm crashes ("Exit handler never called!") packing a
      # bundledDependencies package in CI, so let pnpm build the tarball and
      # use npm only to upload it (which keeps OIDC trusted publishing).
      - name: Pack tarball with pnpm
        run: pnpm pack

      - name: Publish to npm
        run: npm publish "$(ls *.tgz)" --access public

      - name: Show npm debug log on failure
        if: failure()
        run: |
          shopt -s nullglob
          for f in ~/.npm/_logs/*-debug-*.log; do
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done
