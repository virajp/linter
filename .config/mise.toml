[settings]
activate_aggressive = true
all_compile = false
gpg_verify = true
raw = true
status.missing_tools = "always"
task.disable_spec_from_run_scripts = true
task.timings = true

# NodeJS settings
node.compile = false
npm.package_manager = "pnpm"

[tools]
node = { version = "latest" }
pnpm = { version = "latest" }

[env]
_.path = { path = "node_modules/.bin", tools = true }
