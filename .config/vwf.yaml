config_format: 28
blueprint_format: 26

ui: false
integrations: false

stacks: [ stackgen ]

addons: []

repo:
  stack:
    template: unresolved

projects:
  linter:
    stack:
      template: unresolved
      services: []
      deploy: [ npm-package ]
      frameworks: []
      dependencies: []
    cicd: github-actions

blueprint:
  coverage: partial
  remaining: [ coherence ]

enforcement:
  rules:
    baseline/boundary-validation/entities/linter-config:
      waived: true
      reason: unknown keys and preset names warn and are ignored so the config
        stays forward-compatible; a missing version or a value of the wrong type
        is still rejected
    pipeline/dependency-audit/GHSA-238p-pmpm-9mq7:
      waived: true
      reason: "2026-10-09 — katex <0.18.2 via @eslint/markdown > micromark-extension-math, which requires katex ^0.16.0; no in-range fix"
