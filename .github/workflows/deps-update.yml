name: Monthly Dependency Update

on:
  schedule:
    # 02:00 UTC on the 1st of every month
    - cron: "0 2 1 * *"
  workflow_dispatch: {}

# Needs contents:write to push the refresh commit + tag, and actions:write to
# dispatch release.yml. No id-token:write -- this workflow no longer publishes.
permissions:
  contents: write
  actions: write

env:
  MISE_ENV: ci

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v4

      # Mirrors .config/mise/tasks/setup/pnpm/upgrade -- two lockfile-only
      # resolution passes, then one install:
      #   1. Seed the lockfile so typescript resolves against its package.json
      #      range. `pnpm update --latest` resolves the `latest` dist-tag even
      #      for packages excluded with `!`, which otherwise pulls typescript 7
      #      -- unsupported by eslint/typescript-eslint, and it would be
      #      published inside the bundledDependencies tarball.
      #   2. A `pnpm update` that downloads leaks handles on the pnpm store
      #      index and never exits (pnpm 11.18.0). A CI runner always has a cold
      #      store, so this would hang the job. `--lockfile-only` downloads
      #      nothing; the final install is the only pass that touches the store.
      - name: Update dependencies to latest
        run: |
          pnpm install --lockfile-only
          pnpm update --latest "!typescript" --lockfile-only
          pnpm install

      - name: Detect changes
        id: changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency updates available."
          fi

      - name: Scan for vulnerabilities
        if: steps.changed.outputs.changed == 'true'
        run: osv-scanner scan source --lockfile=pnpm-lock.yaml

      - name: Build and test
        if: steps.changed.outputs.changed == 'true'
        run: pnpm run test:all

      - name: Configure git
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit dependency refresh
        if: steps.changed.outputs.changed == 'true'
        run: |
          git add package.json pnpm-lock.yaml
          git commit -m "ops(deps): monthly dependency refresh"

      - name: Bump version and tag
        id: version
        if: steps.changed.outputs.changed == 'true'
        run: |
          pnpm version patch --no-git-tag-version
          NEW_VERSION="v$(node -p "require('./package.json').version")"
          git add package.json
          git commit -m "ops: release ${NEW_VERSION}"
          git tag -a "${NEW_VERSION}" -m "ops: release ${NEW_VERSION}"
          echo "tag=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Push commit and tag
        if: steps.changed.outputs.changed == 'true'
        run: git push origin HEAD:main --follow-tags

      # npm allows exactly one trusted publisher per package, and
      # @askviraj/linter's is registered to release.yml -- publishing from here
      # fails the OIDC token exchange with a misleading 404. So hand off to
      # release.yml instead of publishing inline.
      #
      # A tag push from GITHUB_TOKEN does not trigger release.yml, but
      # workflow_dispatch is an explicit exception: events from GITHUB_TOKEN
      # generally do not start new runs, except workflow_dispatch and
      # repository_dispatch, which always do.
      #
      # Dispatching against the tag ref (not main) keeps release.yml's
      # tag-vs-package.json version check active.
      - name: Trigger release workflow
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run release.yml --ref "$TAG"
